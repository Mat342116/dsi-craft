name: Build DSi Craft

on:
  workflow_dispatch:
  push:
    branches: [ main, feature/creative-mode-core ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Compile Nintendo DS ROM
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            devkitpro/devkitarm:latest \
            bash -lc "make"

      - name: Verify ROM
        run: |
          test -s DSiCraft.nds
          file DSiCraft.nds

      - name: Upload Nintendo DS ROM
        uses: actions/upload-artifact@v4
        with:
          name: DSi-Craft-ROM
          path: DSiCraft.nds
          if-no-files-found: error
