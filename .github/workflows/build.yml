
name: Build DSi Craft

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Install devkitPro
        uses: devkitPro/setup-devkitpro@v1
        with:
          devkitarm: true
          install-devkitarm: true

      - name: Compile game
        run: |
          make

      - name: Upload Nintendo DS ROM
        uses: actions/upload-artifact@v4
        with:
          name: DSi-Craft-ROM
          path: '*.nds'
