
name: Build DSi Craft

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Compile Nintendo DS game
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            devkitpro/devkitarm:latest \
            make

      - name: Upload Nintendo DS ROM
        uses: actions/upload-artifact@v4
        with:
          name: DSi-Craft-ROM
          path: '*.nds'
